<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Consignor | Kickz Caviar</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="dashboard-body">
  <main class="consignor-application-page">
    <section class="consignor-application-card">
      <a class="dashboard-brand" href="/">
        <img src="https://i.imgur.com/gRmfHif.png" alt="Kickz Caviar" class="dashboard-brand-logo" />
      </a>

      <div class="dashboard-eyebrow">Kickz Caviar Seller Network</div>
      <h1>Become a Consignor</h1>

      <p>
        Apply to have your stock listed directly as In-Stock items across our partner stores.
      </p>

      <div id="consignorApplicationState"></div>
    </section>
  </main>

  <script>
    const state = document.getElementById("consignorApplicationState");
    const seller = JSON.parse(localStorage.getItem("kc_seller") || "null");
  
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve(null);
          return;
        }
  
        const reader = new FileReader();
  
        reader.onload = () => {
          resolve({
            name: file.name,
            type: file.type,
            data: reader.result
          });
        };
  
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }
  
    if (!seller) {
      localStorage.setItem("kc_after_login_redirect", "/consignment-application");
      window.location.href = "/dashboard";
    } else if (seller.consignor === true) {
      state.innerHTML = `
        <div class="dashboard-empty-state">
          <strong>You are already approved as a consignor.</strong>
          <p>You can manage your consignment inventory from your dashboard.</p>
          <a class="dashboard-back-link" href="/dashboard">Open Dashboard</a>
        </div>
      `;
    } else {
      state.innerHTML = `
        <form class="consignor-application-copy" id="consignorApplicationForm">
          <label>
            <input type="checkbox" id="inventoryAgreement" required />
            I agree to keep my inventory as accurate and up to date as possible.
          </label>
  
          <label>
            <input type="checkbox" id="shippingAgreement" required />
            I agree to ship sold items within 48 hours whenever possible.
          </label>
  
          <label>
            <input type="checkbox" id="removalAgreement" required />
            I understand repeated fulfillment failures may result in removal from the network.
          </label>
  
          <label>
            Inventory Upload / Screenshots
            <input type="file" id="inventoryFile" accept=".csv,.xlsx,.xls,.pdf,image/*" />
          </label>
  
          <label>
            Proof / References
            <input type="file" id="proofFile" accept=".pdf,image/*" />
          </label>
  
          <label>
            Notes
            <textarea id="applicationNotes" rows="4" placeholder="Optional notes..."></textarea>
          </label>
  
          <p class="consignor-application-note">
            Inventory uploads, store screenshots or references are optional, but may improve your chances of being approved.
          </p>
  
          <button class="modal-submit" id="startApplicationBtn" type="submit">
            Submit Application
          </button>
  
          <div class="dashboard-form-error" id="applicationError"></div>
        </form>
      `;
  
      document.getElementById("consignorApplicationForm").addEventListener("submit", async (event) => {
        event.preventDefault();
  
        const button = document.getElementById("startApplicationBtn");
        const error = document.getElementById("applicationError");
  
        error.textContent = "";
        button.disabled = true;
        button.textContent = "Submitting...";
  
        try {
          const inventoryFile = document.getElementById("inventoryFile").files[0] || null;
          const proofFile = document.getElementById("proofFile").files[0] || null;
  
          const response = await fetch("/api/consignment/application", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              seller_record_id: seller.id,
              discord: seller.discord || "",
              notes: document.getElementById("applicationNotes").value || "",
              inventory_file: await fileToBase64(inventoryFile),
              proof_file: await fileToBase64(proofFile)
            })
          });
  
          const data = await response.json();
  
          if (!response.ok) {
            throw new Error(data.details || data.error || "Failed to submit application");
          }
  
          state.innerHTML = `
            <div class="dashboard-empty-state">
              <strong>Application submitted.</strong>
              <p>We’ll review your application and enable consignment access if approved.</p>
              <a class="dashboard-back-link" href="/dashboard">Back to Dashboard</a>
            </div>
          `;
        } catch (err) {
          error.textContent = err.message;
          button.disabled = false;
          button.textContent = "Submit Application";
        }
      });
    }
  </script>
</body>
</html>
