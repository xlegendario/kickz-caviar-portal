<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kickz Caviar Portal</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">KC</div>
      <div class="brand-text">
        <h1>Kickz Caviar</h1>
        <span>Member Marketplace</span>
      </div>
    </div>

    <div class="main-toggle">
      <button class="toggle-btn active">Selling</button>
      <button class="toggle-btn">Buying</button>
    </div>

    <button class="login-btn">Login</button>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-content">
        <h2>Sell inventory directly to Kickz Caviar</h2>
        <p>Claim quick deals instantly or place offers on active Want To Buys.</p>
      </div>
    </section>

    <section class="market-tabs">
      <button class="market-tab active">Quick Deals</button>
      <button class="market-tab">Want To Buys</button>
    </section>

    <section class="toolbar">
      <input type="text" placeholder="Search SKU, product..." class="search-input"/>

      <select class="toolbar-select">
        <option>All Brands</option>
        <option>Nike</option>
        <option>Jordan</option>
        <option>Adidas</option>
      </select>

      <select class="toolbar-select">
        <option>Margin / VAT21</option>
        <option>VAT0</option>
      </select>

      <div class="view-toggle">
        <button class="view-btn active">Cards</button>
        <button class="view-btn">Table</button>
      </div>
    </section>

    <section id="dealsGrid" class="deals-grid"></section>
  </main>

  <div id="loginModal" class="modal-backdrop hidden">
    <div class="login-modal">
      <button id="closeLoginModal" class="modal-close">×</button>
  
      <h2>Login</h2>
      <p>Use your seller email and temporary password.</p>
  
      <form id="loginForm">
        <label>Email</label>
        <input id="loginEmail" type="email" required placeholder="you@example.com" />
  
        <label>Password</label>
        <input id="loginPassword" type="password" required placeholder="discord-00001" />
  
        <button type="submit" class="modal-submit">Login</button>
  
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
