<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Kickz Caviar</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body class="dashboard-body">
  <section class="dashboard-login-panel">
    <div class="dashboard-login-card">
      <div class="dashboard-eyebrow">Seller Portal</div>
      <h2>Set your password</h2>
      <p>Create a password for your Kickz Caviar Seller Portal account.</p>

      <form id="resetPasswordForm" class="dashboard-login-form">
        <label>
          New password
          <input id="passwordInput" type="password" autocomplete="new-password" required />
        </label>

        <label>
          Confirm password
          <input id="passwordConfirmInput" type="password" autocomplete="new-password" required />
        </label>

        <button type="submit">Save Password</button>

        <div class="dashboard-form-error" id="resetPasswordMessage"></div>
      </form>
    </div>
  </section>

  <script>
    const resetPasswordForm = document.getElementById("resetPasswordForm");
    const passwordInput = document.getElementById("passwordInput");
    const passwordConfirmInput = document.getElementById("passwordConfirmInput");
    const resetPasswordMessage = document.getElementById("resetPasswordMessage");

    const token = new URLSearchParams(window.location.search).get("token") || "";

    resetPasswordForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      resetPasswordMessage.textContent = "";
      resetPasswordMessage.style.color = "#ff7b7b";

      try {
        const response = await fetch("/api/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token,
            password: passwordInput.value,
            password_confirm: passwordConfirmInput.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.details || "Failed to reset password");
        }

        resetPasswordMessage.style.color = "#58d86a";
        resetPasswordMessage.textContent = "Password saved. Redirecting to login...";

        setTimeout(() => {
          window.location.href = "/dashboard";
        }, 1200);
      } catch (err) {
        resetPasswordMessage.textContent = err.message;
      }
    });
  </script>
</body>
</html>
